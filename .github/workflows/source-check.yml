name: Source check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: source-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: corepack enable
      - name: Verify repository toolchain
        run: |
          node --version | grep -Eq '^v24\.'
          test "$(pnpm --version)" = "11.15.1"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
